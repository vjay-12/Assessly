
<style>
#erd { padding: 16px 0; }
#erd svg { max-width: 100%; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2e2b4a' : '#EEEDFE',
    primaryBorderColor: dark ? '#534AB7' : '#534AB7',
    primaryTextColor: dark ? '#c2c0b6' : '#26215C',
    secondaryColor: dark ? '#0f3d2e' : '#E1F5EE',
    tertiaryColor: dark ? '#3d2010' : '#FAECE7',
  },
});

const diagram = `erDiagram
  users {
    UUID id PK
    VARCHAR email
    VARCHAR full_name
    VARCHAR password_hash
    user_role role
    BOOLEAN is_verified
    BOOLEAN is_deleted
    TIMESTAMPTZ created_at
  }
  assessments {
    UUID id PK
    VARCHAR title
    VARCHAR category
    difficulty_level difficulty
    INTEGER duration_minutes
    INTEGER total_questions
    INTEGER pass_mark
    BOOLEAN is_published
    INTEGER max_attempts
    UUID created_by FK
    TIMESTAMPTZ created_at
  }
  questions {
    UUID id PK
    UUID assessment_id FK
    TEXT question_text
    TEXT code_snippet
    TEXT_ARRAY options
    INTEGER correct_option
    INTEGER points
    INTEGER difficulty
    INTEGER sort_order
  }
  assessment_assignments {
    UUID id PK
    UUID assessment_id FK
    UUID candidate_id FK
    TIMESTAMPTZ due_at
    TIMESTAMPTZ assigned_at
  }
  test_sessions {
    UUID id PK
    UUID candidate_id FK
    UUID assessment_id FK
    enrollment_status status
    application_status application_status
    FLOAT score_percentage
    INTEGER correct_count
    INTEGER total_answered
    INTEGER time_taken_seconds
    TIMESTAMPTZ started_at
    TIMESTAMPTZ submitted_at
    TIMESTAMPTZ evaluated_at
    VARCHAR worker_id
  }
  session_responses {
    UUID id PK
    UUID session_id FK
    UUID question_id FK
    INTEGER selected_option
    BOOLEAN is_correct
    BOOLEAN flagged
    INTEGER time_spent_seconds
    TIMESTAMPTZ answered_at
  }
  otp_tokens {
    UUID id PK
    UUID user_id FK
    UUID session_id FK
    VARCHAR token_hash
    BOOLEAN is_used
    TIMESTAMPTZ expires_at
    TIMESTAMPTZ used_at
    VARCHAR ip_address
  }
  refresh_tokens {
    UUID id PK
    UUID user_id FK
    VARCHAR token_hash
    BOOLEAN is_revoked
    TIMESTAMPTZ expires_at
    TIMESTAMPTZ created_at
  }
  pending_evaluations {
    UUID id PK
    UUID session_id FK
    TIMESTAMPTZ queued_at
  }
  audit_logs {
    SERIAL id PK
    UUID user_id FK
    audit_event_type event_type
    severity_level severity
    TEXT details
    VARCHAR ip_address
    TEXT user_agent
    TIMESTAMPTZ created_at
  }
  department_benchmarks {
    VARCHAR category PK
    FLOAT avg_score
    INTEGER candidate_count
    FLOAT pass_rate
    TEXT_ARRAY top_skills
    TIMESTAMPTZ last_updated
  }

  users ||--o{ assessments : "creates"
  users ||--o{ assessment_assignments : "assigned to"
  users ||--o{ test_sessions : "attempts"
  users ||--o{ otp_tokens : "owns"
  users ||--o{ refresh_tokens : "holds"
  users ||--o{ audit_logs : "generates"
  assessments ||--o{ questions : "contains"
  assessments ||--o{ assessment_assignments : "assigned via"
  assessments ||--o{ test_sessions : "has"
  questions ||--o{ session_responses : "answered in"
  test_sessions ||--o{ session_responses : "records"
  test_sessions ||--o| pending_evaluations : "queued as"
  test_sessions ||--o{ otp_tokens : "linked to"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>

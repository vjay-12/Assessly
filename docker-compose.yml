version: "3.8"

services:
  valkey:
    image: valkey/valkey:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    command: ["valkey-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "3001:8000"
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://valkey:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - CROSS_APP_SECRET=${CROSS_APP_SECRET}
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "3000:8000"
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://valkey:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM}
      - AUTH_SERVICE_URL=http://auth-service:8000
    depends_on:
      auth-service:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  evaluation-worker:
    build:
      context: .
      dockerfile: services/evaluation-worker/Dockerfile
    env_file: .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://valkey:6379
      - WORKER_ID=worker-1
    depends_on:
      valkey:
        condition: service_healthy
    deploy:
      replicas: 1

  candidate-portal:
    build:
      context: .
      dockerfile: apps/candidate-portal/Dockerfile
    ports:
      - "4000:3000"
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_GATEWAY_URL=http://localhost:3000
      - NEXT_PUBLIC_AUTH_SERVICE_URL=http://localhost:3001
      - NEXT_PUBLIC_ASSESSMENT_ENGINE_URL=http://localhost:4001

  assessment-engine:
    build:
      context: .
      dockerfile: apps/assessment-engine/Dockerfile
    ports:
      - "4001:3000"
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_GATEWAY_URL=http://localhost:3000
      - NEXT_PUBLIC_AUTH_SERVICE_URL=http://localhost:3001

  employer-dashboard:
    build:
      context: .
      dockerfile: apps/employer-dashboard/Dockerfile
    ports:
      - "4002:3000"
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_GATEWAY_URL=http://localhost:3000
      - NEXT_PUBLIC_AUTH_SERVICE_URL=http://localhost:3001

volumes:
  valkey_data:
